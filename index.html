<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="AED Care - 통합 자동심장충격기 관리·안내 플랫폼" />
<title>AED Care · 자동심장충격기 관리·안내 플랫폼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e3342f'/%3E%3Cpath d='M32 49S12 38 12 24c0-12 15-15 20-5 5-10 20-7 20 5 0 14-20 25-20 25z' fill='white'/%3E%3C/svg%3E">

<!-- Leaflet 1.9.4를 로컬 제공해 CDN 차단 환경에서도 지도를 실행합니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>

<style>
/* 디자인 정리: unslop 절차 적용 — unslop by Damir Sokolovsky (@heydamir), CC BY 4.0. 아이콘: Lucide (ISC) */
:root{
  /* 세계: 공공건물 로비 벽의 AED 보관함과 비상 안내 표지. 무광 회색 함 위의 빨간 하트 하나 */
  --bg:#fafafa; --surface:#ffffff; --surface-2:#f4f4f5; --line:rgba(23,23,23,.09); --line-soft:rgba(23,23,23,.06);
  --text:#171717; --text-2:#525252; --muted:#6b6b6b; --faint:#737373;
  --brand:#c62a22; --brand-2:#a8231c; --accent:#171717; --accent-2:#000000;
  --ok:#15803d; --ok-bg:rgba(21,128,61,.08); --ok-line:rgba(21,128,61,.24);
  --warn:#a16207; --warn-bg:rgba(161,98,7,.08); --warn-line:rgba(161,98,7,.26);
  --danger:#c81e1e; --danger-bg:rgba(200,30,30,.07); --danger-line:rgba(200,30,30,.24);
  --r-sm:8px; --r:10px; --r-lg:14px; --r-xl:16px;
  --shadow:0 8px 24px rgba(0,0,0,.08); --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --curve:cubic-bezier(.22,1,.36,1);
  --ease:color .15s var(--curve),background-color .15s var(--curve),border-color .15s var(--curve),box-shadow .15s var(--curve),opacity .2s var(--curve),transform .2s var(--curve);
  --topbar:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Pretendard Variable","Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;
  background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd6e4;border-radius:8px}
.hidden{display:none!important}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- primitives ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:0;
  padding:4px 12px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-line)}
.badge.info{color:var(--text-2);background:var(--surface-2);border-color:var(--line)}
.badge.neutral{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.badge.stopped{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;
  padding:8px 16px;font-size:13px;font-weight:600;transition:var(--ease);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2);color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--brand);color:#fff;border-color:transparent}
.btn.solid:hover{background:var(--brand-2);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.block{width:100%;justify-content:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:20px}
.grid{display:grid;gap:16px}

/* ---------- top bar ---------- */
.topbar{height:var(--topbar);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:0}
.brand-mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--brand)}
.brand b{font-size:16px;line-height:1.05;display:block}
.brand small{font-size:12px;color:var(--muted);letter-spacing:0;display:block}
.tabs{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.tab{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2);transition:var(--ease);display:flex;align-items:center;gap:8px}
.tab:hover{background:var(--surface-2)}
.tab.active{color:var(--text);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--brand)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.tabs{flex:1 1 auto;min-width:0}.brand{flex:none;white-space:nowrap}.mode-switch,.ms-btn,.mode-chip,.top-export{white-space:nowrap;flex:none}
.tab.active{border-radius:8px 8px 0 0}
.kpi-grid.kpi-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.kpi-grid.kpi-5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kpi-grid.kpi-5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500;color:var(--text-2)}
.mode-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px}
.ms-btn{padding:4px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);transition:var(--ease)}
.ms-btn:hover{color:var(--text)}
.ms-btn.active{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),var(--shadow-sm)}

.wrap{max-width:1500px;margin:0 auto;padding:24px 20px 60px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:600;line-height:1.2}
.page-head p{color:var(--muted);font-size:13px;margin-top:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- kpi ---------- */
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}
.kpi .k-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.kpi .k-val{font-size:28px;font-weight:500;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-foot{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- map layout ---------- */
.map-layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:stretch;height:calc(100vh - var(--topbar) - 120px);min-height:520px}
.map-stage{position:relative;min-width:0;min-height:520px;border-radius:var(--r-lg);overflow:hidden;background:#f4f4f5}
#map{width:100%;height:100%;min-height:520px;border-radius:var(--r-lg);border:1px solid var(--line);z-index:1;background:
  linear-gradient(rgba(23,23,23,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,23,.05) 1px,transparent 1px),#f4f4f5;background-size:48px 48px}
.map-status-notice{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:12px;color:var(--text-2);pointer-events:none}
#dbItems{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.db-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}.db-head span{font-size:12px;font-weight:400;color:var(--muted)}
.db-note{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 2px}.db-item{border-left:3px solid #0f8b8d}
.db-cluster{border-radius:50%;background:rgba(15,139,141,.88);color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.db-cluster:hover{background:#0b6f71}
.db-sido{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.db-sido-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:12px;color:var(--text);text-align:left}
.db-sido-btn:hover{background:var(--surface-2)}.db-sido-btn span{color:var(--muted);font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.map-status-notice.ok{border-color:var(--ok-line);color:var(--ok)}.map-status-notice.warn{border-color:var(--warn-line);color:var(--warn)}.map-status-notice.danger{border-color:var(--danger-line);color:var(--danger)}
.static-map{position:relative;width:100%;height:100%;min-height:520px;overflow:hidden;background:linear-gradient(rgba(23,23,23,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,23,.06) 1px,transparent 1px),#f4f4f5;background-size:52px 52px,52px 52px,auto}
.static-map:before{content:"대한민국 좌표 기반 오프라인 지도";position:absolute;left:18px;top:16px;color:var(--muted);font-size:12px;font-weight:600}
.static-map-marker{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 10px rgba(24,33,47,.3);cursor:pointer}
.static-map-marker span{display:grid;place-items:center;height:16px;transform:rotate(45deg);color:#fff}.static-map-marker.active{outline:3px solid rgba(23,23,23,.35)}
.static-map-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:32px}.static-map-empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.aed-list{overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:8px;margin-bottom:4px}
.search-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 12px;background:var(--surface);outline:none}
.search-row input:focus{border-color:var(--accent)}
.aed-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;transition:var(--ease)}
.aed-item:hover{border-color:rgba(23,23,23,.18);background:var(--surface-2)}
.aed-item.active{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.aed-item .ai-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aed-item strong{font-size:14px}
.aed-item .addr{font-size:12px;color:var(--muted);margin-top:4px}
.aed-item .meta{display:flex;gap:12px;font-size:12px;color:var(--faint);margin-top:8px;flex-wrap:wrap}
.leaflet-popup-content{margin:12px 16px;font-size:13px}
.leaflet-popup-content b{font-size:14px}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:0;font-weight:600;white-space:nowrap}
.table td{padding:12px;border-bottom:1px solid var(--line-soft);color:var(--text-2);vertical-align:middle;font-variant-numeric:tabular-nums}
.table tbody tr{transition:var(--ease)}
.table tbody tr:hover{background:var(--surface-2)}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}
.rank.danger{background:var(--danger)} .rank.warn{background:var(--warn)} .rank.ok{background:var(--ok)}

/* ---------- form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.control{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 12px;outline:none;transition:var(--ease)}
.control:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(23,23,23,.08)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .wide{grid-column:1/-1}

/* ---------- learn (사용법 학습) ---------- */
.learn-stage{max-width:620px;margin:0 auto}
.learn-progress{display:flex;gap:8px;margin-bottom:20px}
.learn-progress .seg{flex:1;height:6px;border-radius:6px;background:var(--line)}
.learn-progress .seg.on{background:var(--brand)}
.step-card{text-align:center;padding:32px 24px}
.step-ico{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:var(--surface-2);color:var(--brand)}
.step-card .n{font-size:13px;font-weight:500;color:var(--muted)}
.step-card h2{font-size:24px;letter-spacing:0;margin:8px 0 12px}
.step-card p{font-size:15px;color:var(--text-2);line-height:1.65}
.step-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.quiz-q{border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;background:var(--surface)}
.quiz-q h3{font-size:16px;margin-bottom:12px}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;transition:var(--ease);background:var(--surface)}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.quiz-opt.wrong{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);font-weight:600}
.quiz-opt.disabled{pointer-events:none;opacity:.75}
.quiz-explain{margin-top:12px;padding:12px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--text-2)}

/* 점검 기록 — 다음 점검일 실시간 자동 계산 미리보기 */
.next-preview{border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 16px;background:var(--surface-2)}
.next-preview .np-head{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.next-preview .np-grid{display:grid;grid-template-columns:1fr auto 1.2fr;gap:8px;align-items:center}
.next-preview .np-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.next-preview .np-cell small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.next-preview .np-cell b{font-size:15px;letter-spacing:0}
.next-preview .np-cell.highlight{border-color:var(--text);background:var(--surface);position:relative}
.next-preview .np-cell.np-arrow{background:transparent;border:0;color:var(--muted);font-size:12px}
.next-preview .np-dday{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.next-preview .np-foot{margin-top:12px;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.next-preview .np-grid{grid-template-columns:1fr;gap:8px}.next-preview .np-cell.np-arrow{padding:2px}}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:80;opacity:0;pointer-events:none;transition:var(--ease)}
.overlay.show{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(560px,94vw);z-index:90;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;
  opacity:0;pointer-events:none;transition:var(--ease);max-height:90vh;overflow-y:auto}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head h2{font-size:20px;letter-spacing:0}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,8px);z-index:120;background:#171717;color:#fff;
  border-radius:11px;padding:12px 20px;font-size:13px;opacity:0;pointer-events:none;transition:var(--ease);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:32px;text-align:center;border:1px dashed rgba(23,23,23,.16);border-radius:13px;background:var(--surface-2)}
.empty .ic{color:var(--muted);display:grid;place-items:center}
.empty b{display:block;font-size:14px;margin:8px 0 4px}
.empty p{font-size:12px;color:var(--muted);max-width:420px;margin:0 auto}

/* ---------- 긴급 버튼 ---------- */
.btn.emergency{background:var(--brand);color:#fff;border-color:transparent;font-weight:600}
.btn.emergency:hover{background:var(--brand-2);color:#fff}

/* ---------- 모델 태그 / 필터 칩 ---------- */
.model-tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;
  color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-2);transition:var(--ease)}
.filter-chip:hover{background:var(--surface-2);color:var(--text)}
.filter-chip.on{background:var(--text);border-color:transparent;color:#fff}

/* ---------- 제품(모델)별 요약 카드 ---------- */
.model-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.model-card .mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.model-card .mc-top strong{font-size:13px}
.model-card .mc-stats{display:flex;gap:12px;font-size:12px;margin-top:12px;font-weight:600}
.model-card .mc-stats .ok{color:var(--ok)} .model-card .mc-stats .warn{color:var(--warn)} .model-card .mc-stats .danger{color:var(--danger)}

/* ---------- 제품 사용법 그리드 ---------- */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.product-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;text-align:left;transition:var(--ease);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.product-card:hover{border-color:rgba(23,23,23,.18)}
.product-card .pc-img{padding:16px;display:grid;place-items:center}
.product-card .pc-body{padding:16px 16px 20px}
.product-card .pc-tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;margin-bottom:8px}
.product-card .pc-body strong{display:block;font-size:16px;letter-spacing:0}
.product-card .pc-body p{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .pc-more{display:inline-block;font-size:12px;font-weight:600;margin-top:12px}
.feat-row{display:flex;flex-wrap:wrap;gap:8px}
.feat{font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 12px}
.prod-steps{list-style:none;counter-reset:s;display:grid;gap:8px;margin-top:4px}
.prod-steps li{counter-increment:s;position:relative;padding:12px 12px 12px 44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--text-2)}
.prod-steps li:before{content:counter(s);position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

/* ---------- 조치 가이드 ---------- */
.guide-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface)}
.guide-item.urgent{border-color:var(--danger-line);background:var(--danger-bg)}
.guide-item .gi-task{display:flex;align-items:center;gap:8px;font-size:14px}
.guide-item .gi-ico{display:inline-grid;color:var(--muted)}
.gi-lbl{font-size:13px;font-weight:600;color:var(--text-2);margin:20px 0 8px}
.gi-prep{list-style:none;display:grid;gap:4px;font-size:13px;color:var(--text-2)}

/* ---------- 홈 · 필터 · 상세 · 복구 ---------- */
.home-hero{padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);display:grid;grid-template-columns:minmax(0,1.25fr) 200px minmax(0,.8fr);gap:32px;align-items:center}
.hero-cabinet{display:grid;place-items:center}.hero-cabinet svg{width:180px;height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.08))}
.hero-path{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px;padding:0;font-size:13px;color:var(--text-2)}
.hero-path li{display:flex;align-items:center;gap:8px}.hero-path .route-n{width:20px;height:20px;font-size:12px}.hero-path li:last-child .route-n{background:var(--brand);border-color:var(--brand);color:#fff}.hero-path .sep{color:var(--muted)}
.home-hero h1{font-size:36px;line-height:1.2;font-weight:600;margin-top:12px}.home-hero p{color:var(--text-2);margin-top:12px;max-width:680px}
.home-emergency{background:var(--brand);border-radius:14px;padding:24px;color:#fff;text-align:left}.home-emergency .he-ico{display:grid;place-items:start;margin-bottom:12px;color:#fff}
.home-emergency .btn{margin-top:16px;background:#fff;color:var(--brand);border:0;justify-content:center;font-size:18px;font-weight:600;width:100%;padding:12px}.home-emergency .btn:hover{background:#f4f4f5;color:var(--brand-2)}
.cta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.cta-card{padding:20px;text-align:left;transition:var(--ease)}
.cta-card:hover{background:var(--surface-2)}.cta-ico{display:grid;color:var(--text-2)}.cta-card b{display:block;margin:8px 0 4px}.cta-card p{font-size:12px;color:var(--muted)}
.filter-panel{display:grid;grid-template-columns:minmax(210px,2fr) repeat(3,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.filter-panel.map-filter{grid-template-columns:minmax(180px,1fr) minmax(130px,.55fr);margin:0 0 8px}
.filter-summary{font-size:12px;color:var(--muted);margin:2px 0 12px}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.check-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);font-size:13px}.check-item input{margin-top:4px;accent-color:var(--brand)}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail-cell{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}.detail-cell small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail-cell b{font-size:13px}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}.tl-item{position:relative;padding:0 0 12px}.tl-item:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff}.tl-item time{font-size:12px;color:var(--muted)}.tl-item h5{font-size:13px;margin:2px 0}.tl-item p{font-size:12px;color:var(--text-2)}
.badge.demo{color:#854d0e;background:#fef9c3;border:1px solid rgba(133,77,14,.25)}
.dot.warn{background:var(--warn)}
.demo-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid rgba(133,77,14,.22);background:#fefce8;color:#713f12;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.demo-banner .btn{margin-left:auto}
.reco-panel{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);margin-bottom:12px}
.reco-head{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px;margin-bottom:4px}
.reco-ref{font-size:12px;color:var(--text-2);margin-bottom:8px}
.reco-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.reco-search{display:flex;gap:8px;margin-bottom:8px}.reco-search .control{flex:1;padding:8px 12px;font-size:13px}
.reco-search-result{display:grid;gap:4px;margin-bottom:8px}
.reco-place{display:block;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 8px;cursor:pointer;font-size:12px}.reco-place span{display:block;color:var(--muted);font-size:12px}.reco-place:hover{background:var(--surface);border-color:rgba(23,23,23,.18)}
.reco-sub{font-size:13px;font-weight:600;margin:12px 0 8px}
.reco-card{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}
.reco-card.confirmed{border-left-color:var(--ok)}.reco-card.unconfirmed{border-left-color:var(--warn)}.reco-card.excluded{border-left-color:var(--danger);background:var(--surface-2)}
.reco-dist{font-size:12px;font-weight:600;color:var(--text-2);margin:4px 0}
.reco-badges{display:flex;flex-wrap:wrap;gap:4px}
.reco-why{font-size:12px;color:var(--text-2);margin-top:8px}.reco-why ul{margin:2px 0 0 16px}.reco-why.warn{color:var(--warn)}
.reco-meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.reco-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.reco-alert{border-radius:10px;padding:8px 12px;font-size:12px;margin:8px 0}.reco-alert.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--text-2)}.reco-alert.danger{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger)}
.reco-excluded summary{cursor:pointer;font-size:13px;font-weight:600;margin:8px 0 8px}
.route-steps{list-style:none;display:grid;gap:0;padding:4px 0;margin:0}.route-steps li{position:relative;display:flex;gap:12px;align-items:center;padding:8px 0}.route-steps li:not(:last-child):after{content:"";position:absolute;left:11px;top:36px;bottom:-4px;width:2px;background:rgba(23,23,23,.14)}.route-steps small{display:block;color:var(--muted);font-size:12px}.route-steps b{font-weight:500}.route-n{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--text);color:var(--text);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}.route-steps li:last-child .route-n{background:var(--brand);border-color:var(--brand);color:#fff}
.route-inline{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--text-2);margin:4px 0}.route-inline span.sep{color:var(--muted)}.route-inline span.box{color:var(--brand);font-weight:600}
.reco-card.top{border-color:rgba(23,23,23,.24);border-left-color:var(--ok);box-shadow:var(--shadow)}
.i{flex:none;vertical-align:-3px}
.sched-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sched-grid .control{padding:8px;font-size:12px}
@media(max-width:640px){.sched-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.top-export{white-space:nowrap}.notice-box{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:12px;padding:12px;font-size:13px;color:var(--text-2)}

@media(max-width:1100px){.cta-grid{grid-template-columns:repeat(2,1fr)}.filter-panel{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .home-hero{grid-template-columns:1fr}.hero-cabinet{display:none}.top-right{gap:8px}
  .top-export{padding:8px 8px}

  .map-layout{grid-template-columns:1fr;height:auto}
  .map-stage,#map,.static-map{height:420px;min-height:420px}
  .aed-list{max-height:320px}
  .tabs .tab span{display:none}
}
@media(max-width:640px){
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .tab{padding:8px 12px}.tab span{display:inline!important}
  .wrap{padding:16px 12px 48px}
  .page-head h1{font-size:20px}
  /* 응급 상황 대비: 핵심 버튼은 손가락에 맞게 크게 */
  .btn{padding:12px 16px;font-size:14px}
  .btn.emergency{font-size:16px;padding:16px}
  .control{padding:12px;font-size:15px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid,.filter-panel,.filter-panel.map-filter,.detail-grid,.check-grid{grid-template-columns:1fr}
  .home-hero{padding:20px}.home-hero h1{font-size:24px}.cta-grid{grid-template-columns:1fr 1fr}
  .top-right{width:100%;justify-content:flex-end;flex-wrap:wrap}.top-export{order:1}.mode-switch{order:2}
}
/* 접근성: 포커스 표시 강화 */
.btn:focus-visible,.control:focus-visible,.tab:focus-visible,.ms-btn:focus-visible,.filter-chip:focus-visible,.product-card:focus-visible,.cta-card:focus-visible,.aed-item:focus-visible,.reco-place:focus-visible,.db-sido-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" stroke="none" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
    <span><b>AED Care</b><small>자동심장충격기 관리·안내</small></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="주요 메뉴"></nav>

    <div class="mode-switch" id="modeSwitch">

      <button class="ms-btn" data-mode="admin">관리자용</button>

    <button class="mode-chip" id="infoChip" title="데이터 저장 안내"><span class="dot ok"></span>데모 · 로컬 저장 ⓘ</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<script>

function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

function closeModal(){const overlay=$("#overlay");overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");$("#modal").classList.remove("show");}

/* ============================================================
   STORE — 데이터 접근 계층 (교체 지점)
   AED 기기 + 점검이력을 localStorage에 보관.
   ============================================================ */
const LegacyStore={
  KEY:"aedcare.v1",
  _db:null,
  _load(){
    if(this._db)return this._db;
    try{const raw=localStorage.getItem(this.KEY);if(raw){this._db=JSON.parse(raw);
      if(!this._db.events)this._db.events=[];
      if(!this._db.tasks)this._db.tasks=[];
      if(!this._db.quiz)this._db.quiz=SEED_QUIZ.slice();
      return this._db;}}catch(e){}
    this._db={devices:SEED.slice(),quiz:SEED_QUIZ.slice(),events:[],tasks:[]};
    this._save();
    return this._db;
  },
  _save(){try{localStorage.setItem(this.KEY,JSON.stringify(this._db));}catch(e){console.warn("save fail",e);}},

  /* ---- 기기 ---- */
  listDevices(){return this._load().devices.slice();},
  getDevice(id){return this._load().devices.find(d=>d.id===id)||null;},
  addDevice(d){
    const db=this._load();
    const dev={
      id:d.id||uid(),name:d.name,address:d.address,
      model:d.model||"",
      building:d.building||"",floor:d.floor||"",spot:d.spot||"",  // 건물명/층수/상세위치
      hours:d.hours||"",access:d.access||"",                      // 운영시간/출입 가능여부
      source:d.source||"manual",                                  // 데이터 출처: manual | csv | public
      lat:+d.lat,lng:+d.lng,
      manager:d.manager||"",phone:d.phone||"",
      battery_expiry:d.battery_expiry||"",pad_expiry:d.pad_expiry||"",
      install_date:d.install_date||todayStr(),
      inspect_cycle_days:+d.inspect_cycle_days||180,
      inspections:[],
    };
    db.devices.push(dev);this._save();return dev;
  },
  updateDevice(id,patch){
    const db=this._load();const d=db.devices.find(x=>x.id===id);if(!d)return null;
    Object.assign(d,patch);this._save();return d;
  },
  removeDevice(id){
    const db=this._load();db.devices=db.devices.filter(d=>d.id!==id);this._save();
  },

  /* ---- 점검 ---- */
  addInspection(deviceId,rec){
    const db=this._load();const d=db.devices.find(x=>x.id===deviceId);if(!d)return null;
    const ins={date:rec.date||todayStr(),result:rec.result||"정상",inspector:rec.inspector||"",memo:rec.memo||"",photo:rec.photo||null};
    d.inspections=d.inspections||[];d.inspections.unshift(ins);this._save();return ins;
  },
  lastInspection(d){return (d.inspections&&d.inspections[0])||null;},
  nextInspectionDate(d){
    const last=this.lastInspection(d);
    const base=last?last.date:d.install_date||todayStr();
    return addDays(base,d.inspect_cycle_days||180);
  },

  /* ---- AED 사용(작동) 이벤트 로그 ----
     앱은 119 신고를 대체하지 않는다. 여기 기록은 '사용 사실'과
     각 처리의 '상태'만 남긴다. 실제 전송이 확인되지 않으면 성공으로 적지 않는다. */
  addUsageEvent(ev){
    const db=this._load();
    const e={id:"EV-"+Date.now().toString(36).toUpperCase(),ts:new Date().toISOString(),
      deviceId:ev.deviceId||null,deviceName:ev.deviceName||"",address:ev.address||"",
      lat:(ev.lat!=null?ev.lat:null),lng:(ev.lng!=null?ev.lng:null),
      // 처리 상태: "called119"(사용자가 119 통화 시도) / "not_integrated"(관리자 알림 미연동)
      call119:ev.call119||"unknown",          // "attempted" | "unknown"
      managerNotify:"not_integrated",          // 실제 전송 서비스 미연동 고정
      recovery:"pending",                      // 사용 후 복구: pending → done (P2-2에서 사용)
      note:ev.note||""};
    db.events=db.events||[];db.events.unshift(e);this._save();
    // 사용된 기기는 '사용 후 점검 필요' 플래그를 세운다 (후속 조치 추적)
    if(ev.deviceId){const d=db.devices.find(x=>x.id===ev.deviceId);if(d){d.needs_post_use_check=true;this._save();}}
    return e;
  },
  listEvents(){return (this._load().events||[]).slice();},
  getEvent(id){return (this._load().events||[]).find(e=>e.id===id)||null;},
  updateEvent(id,patch){const db=this._load();const e=(db.events||[]).find(x=>x.id===id);if(!e)return null;Object.assign(e,patch);this._save();return e;},

  /* ---- 조치 작업(Task) — 위험 상태에 대한 후속 작업 관리 (P1 4-1) ---- */
  listTasks(){return (this._load().tasks||[]).slice();},
  getTask(id){return (this._load().tasks||[]).find(t=>t.id===id)||null;},
  addTask(t){
    const db=this._load();db.tasks=db.tasks||[];
    const task={id:"T-"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*90+10),
      deviceId:t.deviceId||null,title:t.title||"조치",reason:t.reason||"",
      assignee:t.assignee||"",due:t.due||"",status:t.status||"미처리",
      work:t.work||"",photo:t.photo||null,
      created:new Date().toISOString(),updated:new Date().toISOString(),
      history:[{ts:new Date().toISOString(),action:"생성",detail:t.reason||""}]};
    db.tasks.unshift(task);this._save();return task;
  },
  updateTask(id,patch,actionLabel){
    const db=this._load();const t=(db.tasks||[]).find(x=>x.id===id);if(!t)return null;
    Object.assign(t,patch);t.updated=new Date().toISOString();
    t.history=t.history||[];t.history.unshift({ts:t.updated,action:actionLabel||"수정",detail:patch.status||patch.work||""});
    this._save();return t;
  },
  /* 위험 상태 기기에 대해 미완료 작업이 없으면 자동 생성 */
  ensureTasksForRisk(){
    const db=this._load();db.tasks=db.tasks||[];let created=0;
    db.devices.forEach(d=>{
      const st=deviceStatus(d);
      if(st.level==="ok")return;
      const open=db.tasks.find(t=>t.deviceId===d.id&&t.status!=="완료");
      if(open)return;
      db.tasks.unshift({id:"T-"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100),
        deviceId:d.id,title:st.label,reason:st.reasons.join(" / "),
        assignee:d.manager||"",due:"",status:"미처리",work:"",photo:null,
        created:new Date().toISOString(),updated:new Date().toISOString(),
        history:[{ts:new Date().toISOString(),action:"자동 생성",detail:st.reasons.join(" / ")}]});
      created++;
    });
    if(created)this._save();
    return created;
  },

  reset(){localStorage.removeItem(this.KEY);this._db=null;this._load();},
};

    demo:Boolean(d.demo),public_source_id:String(d.public_source_id||"").trim().slice(0,120),public_link_checked_at:String(d.public_link_checked_at||""),
    access_schedule:this._normalizeSchedule(d.access_schedule),access_exceptions:String(d.access_exceptions||"").slice(0,2000),access_note:String(d.access_note||"").slice(0,200),
    access_confirmed_at:String(d.access_confirmed_at||""),access_confirmed_by:String(d.access_confirmed_by||"").slice(0,60),route_entrance:String(d.route_entrance||"").slice(0,120),
    inspections:Array.isArray(d.inspections)?d.inspections.map(i=>({...i,date:String(i.date||""),result:String(i.result||"정상"),inspector:String(i.inspector||""),memo:String(i.memo||""),photo:i.photo||null})):[]};},

    db.events=(Array.isArray(db.events)?db.events:[]).map(e=>({...e,id:String(e.id||"EV-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5)),ts:String(e.ts||new Date().toISOString()),deviceId:e.deviceId||null,deviceName:String(e.deviceName||""),address:String(e.address||""),lat:e.lat==null?null:Number(e.lat),lng:e.lng==null?null:Number(e.lng),call119:e.call119||"unknown",managerNotify:"not_integrated",recovery:e.recovery==="done"?"done":"pending",note:String(e.note||""),recoveredAt:e.recoveredAt||(e.recovery==="done"?(e.ts||null):null),by:String(e.by||e.recoveredBy||""),checks:e.checks&&typeof e.checks==="object"?e.checks:{},memo:String(e.memo||e.recoveryMemo||""),photo:e.photo||e.recoveryPhoto||null,recoveredBy:String(e.by||e.recoveredBy||""),recoveryMemo:String(e.memo||e.recoveryMemo||""),recoveryPhoto:e.photo||e.recoveryPhoto||null}));

function getAlertDays(){const n=Number(Store.getSettings().alertDays);return Number.isFinite(n)&&n>0?n:30;}

/* ============================================================
   상태 판정 — 유효기간/점검주기/최종 점검결과로 기기 상태 산출
   반환: {code, label, level:"ok|warn|danger"(하위호환), reasons:[], asOf, basis}
   8단계 code:
     normal          정상
     inspect_due     점검 예정
     inspect_overdue 점검 기한 초과
     battery_due     배터리 교체 필요
     pad_due         패드 교체 필요
     repair          수리 필요
     unusable        사용 불가
     unverified      상태 미확인(점검 기록 없음/오래됨)
   ============================================================ */
const STALE_DAYS=400;        // 최종 점검이 이보다 오래되면 '미확인'으로 간주(연 1회+여유)
/* code → {label, level} 매핑. level은 기존 UI(badge/marker/정렬) 하위호환용 */
const STATUS_DEF={
  normal:{label:"정상",level:"ok"},
  inspect_due:{label:"점검 예정",level:"warn"},
  inspect_overdue:{label:"점검 기한 초과",level:"danger"},
  battery_due:{label:"배터리 교체 필요",level:"warn"},
  pad_due:{label:"패드 교체 필요",level:"warn"},
  repair:{label:"수리 필요",level:"danger"},
  unusable:{label:"사용 불가",level:"danger"},
  unverified:{label:"상태 미확인",level:"warn"},
  post_use:{label:"사용 후 점검 필요",level:"danger"},
};
/* 점검 결과 문자열 → 심각 상태 code (수리필요/사용불가 우선 반영) */
function resultToCode(result){
  const v=String(result||"").replace(/\s/g,"");
  if(v.includes("사용불가"))return "unusable";
  if(v.includes("수리"))return "repair";
  return null;
}
function deviceStatus(d){
  const today=todayStr();const reasons=[];
  const last=Store.lastInspection(d);
  const SEV=["normal","inspect_due","battery_due","pad_due","unverified","inspect_overdue","repair","unusable","post_use"];
  let code="normal";
  const raise=(c,why)=>{if(why&&!reasons.includes(why))reasons.push(why);if(SEV.indexOf(c)>SEV.indexOf(code))code=c;};

  // AED 사용 이후 복구 완료 전에는 다른 조건보다 우선해 현장 점검을 요구한다.
  if(d.needs_post_use_check)raise("post_use","AED 사용 후 복구·재사용 준비 확인이 완료되지 않음");

  // 최종 점검 결과가 수리필요/사용불가면 즉시 위험 상태로 표시한다.
  const rc=last?resultToCode(last.result):null;
  if(rc)raise(rc,`최종 점검 결과: ${last.result} (${last.date})`);

  // 소모품 날짜가 없으면 정상으로 판정하지 않는다.
  const chk=(label,date,dueCode)=>{
    if(!date){raise("unverified",`${label} 유효기간 미확인`);return;}
    const left=daysBetween(today,date);
    if(left<0)raise(dueCode,`${label} 만료 (${-left}일 경과)`);
    else if(left<=getAlertDays())raise(dueCode,`${label} 만료 임박 (D-${left})`);
  };
  chk("배터리",d.battery_expiry,"battery_due");
  chk("패드",d.pad_expiry,"pad_due");

  // 기관별 기기 점검주기와 이번 달 점검 기록을 별도로 확인한다.
  const next=Store.nextInspectionDate(d);const nleft=daysBetween(today,next);
  if(nleft<0)raise("inspect_overdue",`점검 기한 초과 (${-nleft}일)`);
  else if(nleft<=getAlertDays())raise("inspect_due",`점검 예정 (D-${nleft})`);
  const currentMonth=today.slice(0,7);
  if(!(d.inspections||[]).some(i=>String(i.date||"").slice(0,7)===currentMonth))raise("inspect_due",`${currentMonth} 월별 점검 기록 미확인`);

  // 핵심 관리정보 또는 점검 근거가 없으면 미확인 상태로 둔다.
  if(!last)raise("unverified","점검 기록 없음 — 상태 확인 필요");
  else if(daysBetween(last.date,today)>STALE_DAYS)raise("unverified",`최종 점검이 오래됨 (${last.date})`);
  if(!d.model)raise("unverified","제품 모델 미확인");
  if(!Number.isFinite(Number(d.lat))||!Number.isFinite(Number(d.lng))||Number(d.lat)===0||Number(d.lng)===0)raise("unverified","설치 좌표 미확인");

  const def=STATUS_DEF[code]||STATUS_DEF.normal;
  return {code,label:def.label,level:def.level,reasons,asOf:last?last.date:null,
    basis:"사용 후 복구 · 소모품 유효기간 · 월별/기관별 점검주기 · 최종 점검결과"};
}
/* 상태 뱃지 — code 기준. '미확인'은 중립(회색) 톤으로 표시 */
function statusBadge(st,text){
  const cls=st.code==="unverified"?"neutral":st.level;
  return `<span class="badge ${cls}">${esc(text||st.label)}</span>`;
}

/* 시급도 점수 — 값이 클수록 더 시급. 대시보드/기기관리 정렬에 사용.
   레벨(위험>임박>정상)을 우선하고, 같은 레벨 안에서는 '가장 임박한 기한까지 남은 일수'로 정렬.
   (만료를 많이 넘겼거나 D-day가 가까울수록 점수가 커짐) */
function urgencyScore(d){
  const today=todayStr();
  const dates=[d.battery_expiry,d.pad_expiry,Store.nextInspectionDate(d)].filter(Boolean);
  let minLeft=Infinity;
  dates.forEach(dt=>{const left=daysBetween(today,dt);if(left<minLeft)minLeft=left;});
  const st=deviceStatus(d);
  // code별 가중치 (사용불가·수리필요가 최상위)
  const CODE_W={post_use:10000000,unusable:9000000,repair:8000000,inspect_overdue:5000000,
    unverified:3000000,battery_due:2500000,pad_due:2400000,inspect_due:1500000,normal:0};
  const base=CODE_W[st.code]!=null?CODE_W[st.code]:({danger:2000000,warn:1000000,ok:0}[st.level]||0);
  return base-(minLeft===Infinity?0:minLeft);
}
/* 시급한 순으로 정렬된 기기 목록 */
function devicesByUrgency(list){
  return (list||Store.listDevices()).slice().sort((a,b)=>urgencyScore(b)-urgencyScore(a));
}

/* 실제 설치정보는 관리자 등록·CSV·SafeMap 데이터 연동으로만 추가한다. */

/* 제품 이미지: 실제 사진(p.img)이 있으면 사진을, 로드 실패 시 오리지널 일러스트로 폴백.
   사진을 images/ 폴더에 넣으면 자동으로 사진이 우선 표시된다. */
function productMedia(p,{big=false}={}){
  const h=big?170:124;
  const svg=productSvg(p,{big});
  if(p.img){
    // onerror: 사진 파일이 없으면 자리의 일러스트로 교체
    return `<img src="${p.img}" alt="${esc(p.name)} 제품 사진" loading="lazy"
      style="width:100%;height:${h}px;object-fit:contain"
      onerror="this.outerHTML=this.getAttribute('data-fallback')"
      data-fallback='${svg.replace(/'/g,"&#39;")}'>`;
  }
  return svg;
}
/* 모델별 색상과 조작부를 단순화한 오리지널 AED 일러스트 (저작권 안전, 실제 사진 베끼지 않음). */

    <defs><linearGradient id="g-${p.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${p.color}" stop-opacity=".22"/><stop offset="1" stop-color="${p.color}" stop-opacity=".06"/></linearGradient></defs>

/* 조치사항 가이드 — 상태 원인별 필요 조치 + 준비물 (출동 체크리스트) */
function actionGuide(d){
  const today=todayStr();const items=[];
  const batLeft=d.battery_expiry?daysBetween(today,d.battery_expiry):null;
  const padLeft=d.pad_expiry?daysBetween(today,d.pad_expiry):null;
  const next=Store.nextInspectionDate(d);const nLeft=daysBetween(today,next);
  if(d.needs_post_use_check)items.push({urgent:true,task:"AED 사용 후 복구·재사용 준비 확인",
    prep:["사용 기록 및 현장 상황 확인","패드 교체 여부 확인","배터리 상태 확인","자가점검 결과 확인","재배치 후 재사용 가능 여부 확인"]});
  if(batLeft==null)items.push({urgent:false,task:"배터리 유효기간 확인",prep:["기기 라벨 또는 공식 자료 확인","확인한 유효기간 등록","규격이 불명확하면 제조사 문의"]});
  else if(batLeft<=getAlertDays())items.push({urgent:batLeft<0,task:batLeft<0?`배터리 교체 (${-batLeft}일 경과)`:`배터리 교체 준비 (D-${batLeft})`,
    prep:["제품 라벨·공식 매뉴얼로 확인한 호환 배터리","필요 공구","교체 후 자가점검 및 유효기간 등록"]});
  if(padLeft==null)items.push({urgent:false,task:"패드 유효기간 확인",prep:["패드 포장·기기 라벨 확인","확인한 유효기간 등록","호환 규격이 불명확하면 제조사 문의"]});
  else if(padLeft<=getAlertDays())items.push({urgent:padLeft<0,task:padLeft<0?`패드 교체 (${-padLeft}일 경과)`:`패드 교체 준비 (D-${padLeft})`,
    prep:["제품 라벨·공식 매뉴얼로 확인한 호환 패드","성인·소아 적용 방식 확인","교체 후 밀봉·유효기간·연결 상태 확인"]});
  if(nLeft<=getAlertDays())items.push({urgent:nLeft<0,task:nLeft<0?`정기 점검 기한 초과 (${-nLeft}일)`:`정기 점검 예정 (D-${nLeft})`,
    prep:["기관 점검 체크리스트","기기 외관·상태 표시 확인","점검 결과 사진 촬영","점검 이력 등록"]});
  if(!d.model)items.push({urgent:false,task:"제품 모델 확인",prep:["기기 명판 촬영","제조사·정확한 모델 코드 등록","공식 매뉴얼과 소모품 정보 확인"]});
  if(!items.length)items.push({urgent:false,task:"현재 조치 필요 없음",prep:["다음 정기 점검일까지 모니터링"]});
  return items;
}

const ADMIN_PASSWORD="1234@";

function updateAdminChrome(){
  const topExport=$("#topCsvExport");if(topExport)topExport.classList.toggle("hidden",!(adminUnlocked&&activeMode==="admin"));

function renderTabs(){
  const nav=$("#tabs");

    `<button class="tab ${t.id===activeView?"active":""}" data-view="${t.id}">${ico(t.ico)} <span>${t.label}</span></button>`).join("")
    +(activeMode==="admin"?`<button class="tab" id="adminLock" title="관리자 모드 잠금">${ico("lock")} <span>잠금</span></button>`:"");
  nav.querySelectorAll(".tab[data-view]").forEach(t=>t.addEventListener("click",()=>go(t.dataset.view)));
  const lock=nav.querySelector("#adminLock");if(lock)lock.addEventListener("click",lockAdmin);

function setMode(mode,targetView){
  if(!MODES[mode])return;
  const target=targetView&&viewOwner(targetView)===mode?targetView:MODES[mode].tabs[0].id;
  if(mode==="admin"&&!adminUnlocked){pendingAdminView=target;openAdminLogin(target);return;}
  activeMode=mode;
  $$("#modeSwitch .ms-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  renderTabs();go(target);
}

let _map=null,_markers={},_userMarker=null,_mapTileLayer=null,_mapSession=0;
const MAP_TILE_PROVIDERS=[
  {name:"OpenStreetMap",url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",options:{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}},
  {name:"OpenStreetMap DE",url:"https://tile.openstreetmap.de/{z}/{x}/{y}.png",options:{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}},
  {name:"CARTO",url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",options:{maxZoom:20,subdomains:"abcd",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}},

function addTileProvider(index,devices,session){
  if(!_map||session!==_mapSession)return;
  if(index>=MAP_TILE_PROVIDERS.length){renderStaticMapFallback(devices,"외부 배경지도 접속이 제한되어 좌표 기반 지도로 전환했습니다.");return;}
  const provider=MAP_TILE_PROVIDERS[index];let loaded=0,errors=0,switched=false,timer=null;
  const switchProvider=()=>{if(switched||session!==_mapSession)return;switched=true;clearTimeout(timer);try{if(_mapTileLayer)_map.removeLayer(_mapTileLayer);}catch(e){}setMapNotice(`${provider.name} 접속 실패 · 대체 지도로 전환 중…`,"warn");addTileProvider(index+1,devices,session);};
  try{
    _mapTileLayer=L.tileLayer(provider.url,{...provider.options,crossOrigin:true,updateWhenIdle:true,keepBuffer:2});
    _mapTileLayer.on("tileload",()=>{loaded++;if(loaded===1){clearTimeout(timer);setMapNotice(`지도 정상 연결 · ${provider.name}`,"ok");}});
    _mapTileLayer.on("tileerror",()=>{errors++;if(loaded===0&&errors>=4)switchProvider();});
    _mapTileLayer.addTo(_map);

  timer=setTimeout(()=>{if(loaded===0)switchProvider();},7000);
}
function renderStaticMapFallback(devices,reason){
  if(_map){try{_map.remove();}catch(e){}}_map=null;_mapTileLayer=null;_markers={};
  const host=$("#map");if(!host)return;const valid=validMapDevices(devices);
  if(!valid.length){host.innerHTML='<div class="static-map"><div class="static-map-empty"><div><b>지도는 정상 실행 중입니다</b><span>등록된 AED 좌표가 없습니다. 실제 데이터를 등록하면 위치가 표시됩니다.</span></div></div></div>';setMapNotice(reason||"배경지도 없이 실행 중 · 등록된 좌표 없음","warn");dbStaticFallbackNotice();return;}

function initializeMap(devices){

  const cells=new Map();let inView=0;
  for(let i=0;i<P.length;i+=3){
    const lat=P[i]/S,lng=P[i+1]/S;if(lat<minLat||lat>maxLat||lng<minLng||lng>maxLng)continue;
    if(view.contains([lat,lng]))inView++;

    const k=Math.floor(x/cell)*100000+Math.floor(y/cell);let c=cells.get(k);if(!c){c={n:0,lat:0,lng:0};cells.set(k,c);}c.n++;c.lat+=lat;c.lng+=lng;
  }
  cells.forEach(c=>{
    const lat=c.lat/c.n,lng=c.lng/c.n,size=c.n>=5000?60:c.n>=1000?52:c.n>=100?44:c.n>=10?36:28;
    const m=L.marker([lat,lng],{icon:L.divIcon({className:"",html:`<div class="db-cluster" style="width:${size}px;height:${size}px">${fmtCount(c.n)}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]}),title:`공공 AED ${c.n.toLocaleString("ko-KR")}곳 · 눌러서 확대`});

}
/* 시도별 범위로 이동 */
function flyToSido(name){
  if(!_map||!_dbPoints)return;const idx=_dbPoints.sidoNames.indexOf(name);if(idx<0)return;
  const S=_dbPoints.scale||100000,P=_dbPoints.points,lats=[],lngs=[];
  for(let i=0;i<P.length;i+=3){if(P[i+2]===idx){lats.push(P[i]/S);lngs.push(P[i+1]/S);}}
  if(!lats.length)return;
  // 시도 값과 좌표가 어긋난 일부 레코드 때문에 범위가 넓어지지 않도록 양끝 2%를 제외
  lats.sort((x,y)=>x-y);lngs.sort((x,y)=>x-y);
  const q=(arr,p)=>arr[Math.min(arr.length-1,Math.max(0,Math.round((arr.length-1)*p)))];
  _map.fitBounds([[q(lats,.02),q(lngs,.02)],[q(lats,.98),q(lngs,.98)]],{padding:[20,20],maxZoom:12});
}

function distanceMeters(lat1,lng1,lat2,lng2){const R=6371000,toR=x=>x*Math.PI/180,dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);const h=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}

async function loadDbAeds(session){
  if(!_map||session!==_mapSession||!_dbLayer)return;
  if(_map.getZoom()<DB_MIN_ZOOM){
    _dbSeq++;_dbItems=[];_dbLoadedBounds=null;_dbLayer.clearLayers();_dbMarkers={};
    if(!_dbPoints){renderDbItems([],"전국 공공 AED 위치를 불러오는 중…");return;}
    renderDbOverview(renderDbClusters());return;
  }
  if(_dbClusterLayer)_dbClusterLayer.clearLayers();
  const view=_map.getBounds();
  if(_dbLoadedBounds&&!_dbTruncated&&_dbLoadedBounds.contains(view))return; // 이미 받은 범위 안 (팝업 자동 이동 등)
  const area=view.pad(0.15); // 조금 넓게 받아 작은 이동에는 다시 조회하지 않음
  const origin=_userLoc&&area.contains(_userLoc)?_userLoc:_map.getCenter();
  const seq=++_dbSeq;
  const qs=new URLSearchParams({bbox:[area.getWest(),area.getSouth(),area.getEast(),area.getNorth()].map(v=>v.toFixed(5)).join(","),limit:String(DB_FETCH_LIMIT),lat:origin.lat.toFixed(6),lng:origin.lng.toFixed(6)});
  if(!_dbItems.length)renderDbItems([],"공공 AED 데이터베이스 조회 중…");
  const res=await fetchDbJson(`/api/aeds?${qs}`);
  if(seq!==_dbSeq||session!==_mapSession)return;
  if(res.state!=="ok"){_dbItems=[];_dbLayer.clearLayers();_dbMarkers={};renderDbItems([],res.message);return;}
  const j=res.data;
  _dbItems=Array.isArray(j.items)?j.items:[];_dbTruncated=!!j.truncated;_dbLoadedBounds=area;
  _dbOriginLabel=origin===_userLoc?"내 위치에서":"지도 중심에서";
  if(_dbActiveId&&!_dbItems.some(a=>String(a.id)===String(_dbActiveId)))_dbActiveId=null;
  renderDbLayer();
}

function citizenExpiry(date){
  if(!date)return `<span class="muted">-</span>`;
  const left=daysBetween(todayStr(),date);
  const cls=left<0?"danger":left<=getAlertDays()?"warn":"ok";
  const tag=left<0?"만료":left<=getAlertDays()?"임박":"양호";
  return `<span class="badge ${cls}" style="font-size:12px;padding:2px 8px">${tag}</span>`;
}

let _learnIdx=0,_quizMode=false,_quizAnswers=[];
Views.learn=function(host){
  _learnIdx=0;_quizMode=false;_quizAnswers=[];
  renderLearn(host);
};
function renderLearn(host){
  if(_quizMode){renderQuiz(host);return;}
  const total=LEARN_STEPS.length;const s=LEARN_STEPS[_learnIdx];
  const segs=LEARN_STEPS.map((_,i)=>`<div class="seg ${i<=_learnIdx?"on":""}"></div>`).join("");
  host.innerHTML=`
    <div class="learn-stage">
      <div class="page-head" style="justify-content:center;text-align:center"><div>
        <h1>AED 사용법 3분 학습</h1><p>한 단계씩 따라 하면 누구나 응급상황에서 대처할 수 있습니다</p></div></div>
      <div class="learn-progress">${segs}</div>
      <div class="card step-card">
        <div class="step-ico">${ico(s.ico,36)}</div>
        <div class="n">${s.n} / 총 ${total}단계</div>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
      <div class="step-nav">
        <button class="btn" id="prevStep" ${_learnIdx===0?"disabled":""}>← 이전</button>
        <button class="btn solid" id="nextStep">${_learnIdx===total-1?"퀴즈 풀기 →":"다음 →"}</button>
      </div>
      <p class="muted" style="font-size:12px;text-align:center;margin-top:16px">${esc(LEARN_SOURCE.note)} · 출처/개정일 ${esc(LEARN_SOURCE.rev)} (${esc(LEARN_SOURCE.checked)})<br>실제 응급처치는 최신 공식 지침과 AED 음성 안내를 우선합니다.</p>
    </div>`;
  $("#prevStep").addEventListener("click",()=>{if(_learnIdx>0){_learnIdx--;renderLearn(host);}});
  $("#nextStep").addEventListener("click",()=>{
    if(_learnIdx<total-1){_learnIdx++;renderLearn(host);}
    else{_quizMode=true;_quizAnswers=[];renderQuiz(host);}
  });
}
function renderQuiz(host){
  const quiz=Store.listQuiz();
  host.innerHTML=`
    <div class="learn-stage">
      <div class="page-head" style="justify-content:center;text-align:center"><div>
        <h1>확인 퀴즈</h1><p>세 문항으로 핵심을 점검해 보세요</p></div></div>
      <div id="quizBox">${quiz.map((item,qi)=>`
        <div class="quiz-q" data-q="${qi}">
          <h3>Q${qi+1}. ${esc(item.q)}</h3>
          ${item.opts.map((o,oi)=>`<button class="quiz-opt" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join("")}
        </div>`).join("")}</div>
      <div id="quizResult"></div>
      <div class="step-nav">
        <button class="btn" id="backLearn">← 학습으로</button>
        <button class="btn solid" id="resetQuiz">다시 풀기</button>
      </div>
    </div>`;
  host.querySelectorAll(".quiz-opt").forEach(btn=>btn.addEventListener("click",()=>{
    const qi=+btn.dataset.q,oi=+btn.dataset.o;
    if(_quizAnswers[qi]!=null)return;
    _quizAnswers[qi]=oi;
    const correct=quiz[qi].answer;
    const qEl=host.querySelector(`.quiz-q[data-q="${qi}"]`);
    qEl.querySelectorAll(".quiz-opt").forEach(b=>{
      b.classList.add("disabled");
      const o=+b.dataset.o;
      if(o===correct)b.classList.add("correct");
      else if(o===oi)b.classList.add("wrong");
    });
    // 정답/오답 모두 해설 표시 (6장: 오답에 설명 제공)
    if(quiz[qi].explain){
      const ex=document.createElement("div");
      ex.className="quiz-explain";
      ex.innerHTML=`<b>${oi===correct?"정답":"해설"}</b> ${esc(quiz[qi].explain)}`;
      qEl.appendChild(ex);
    }
    if(_quizAnswers.filter(a=>a!=null).length===quiz.length)showQuizResult(host,quiz);
  }));
  $("#backLearn").addEventListener("click",()=>{_quizMode=false;_learnIdx=0;renderLearn(host);});
  $("#resetQuiz").addEventListener("click",()=>{_quizAnswers=[];renderQuiz(host);});
}
function showQuizResult(host,quiz){
  const score=quiz.reduce((a,item,i)=>a+(_quizAnswers[i]===item.answer?1:0),0);
  const pass=score===quiz.length;
  $("#quizResult").innerHTML=`<div class="card pad" style="text-align:center;margin:8px 0 16px;
    border-color:${pass?"var(--ok-line)":"var(--warn-line)"};background:${pass?"var(--ok-bg)":"var(--warn-bg)"}">
    
    <h2 style="font-size:20px;margin:8px 0">${score} / ${quiz.length} 정답</h2>
    <p class="muted" style="font-size:13px">${pass?"모두 맞혔습니다. 응급상황에서 당황하지 말고 배운 대로 행동하세요.":"다시 학습하고 도전해 보세요. 반복이 생명을 구합니다."}</p>
  </div>`;
}

function expiryCell(date){
  if(!date)return `<span class="muted">미입력</span>`;
  const left=daysBetween(todayStr(),date);
  const cls=left<0?"danger":left<=getAlertDays()?"warn":"ok";
  const tag=left<0?`만료 ${-left}일`:`D-${left}`;
  return `${date}<br><span class="badge ${cls}" style="font-size:12px;padding:2px 8px">${tag}</span>`;
}

    if(res.state==="error"&&res.status===404)return {ok:false,message:"DB에 해당 공공데이터 원본 ID가 없습니다. 연결하지 않았습니다."};
    return {ok:false,message:`${res.message} — 원본 ID를 확인하지 못해 연결하지 않았습니다. 연결 없이 저장하려면 칸을 비우세요.`};

  });
}
/* 좌표 유효성 검사 — 대한민국 범위 */
function validateCoords(lat,lng){
  const la=+lat,ln=+lng;
  if(isNaN(la)||isNaN(ln))return "위도·경도를 숫자로 입력하세요.";
  if(la<33||la>39)return "위도는 33~39 범위여야 합니다. (대한민국)";
  if(ln<124||ln>132)return "경도는 124~132 범위여야 합니다. (대한민국)";
  return null;
}

    <button class="btn solid block" id="pickCsv">CSV 파일 선택</button>`);

async function handleCsvUpload(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const {records}=parseCsvSimple(text);
    if(!records.length){toast("CSV에 데이터 행이 없습니다.");return;}
    const seen=Store.listDevices().slice();
    const accepted=[];let skipped=0;const errors=[];
    records.forEach((r,i)=>{
      const name=(r.name||"").trim(),address=(r.address||"").trim();
      if(!name||!address||r.lat===undefined||r.lng===undefined){skipped++;errors.push(`${i+2}행: 필수값 누락`);return;}
      const err=validateCoords(r.lat,r.lng);if(err){skipped++;errors.push(`${i+2}행: ${err}`);return;}
      const candidate={...r,name,address,lat:+r.lat,lng:+r.lng,source:"csv"};
      const dup=seen.some(x=>(normalizeSearch(x.name)===normalizeSearch(name)&&normalizeSearch(x.address)===normalizeSearch(address))||(Math.abs(Number(x.lat)-candidate.lat)<0.0001&&Math.abs(Number(x.lng)-candidate.lng)<0.0001));
      if(dup){skipped++;errors.push(`${i+2}행: 중복 기기(${name})`);return;}
      seen.push(candidate);accepted.push(candidate);
    });
    const added=Store.addDevices(accepted).length;
    closeModal();toast(`등록 ${added}건 · 건너뜀 ${skipped}건`);
    if(errors.length)console.warn("CSV 등록 경고:\n"+errors.join("\n"));
    go("devices");
  }catch(err){toast("CSV 읽기 실패: "+(err.message||err));}
}
/* 간단 CSV 파서 (따옴표 지원) */
function parseCsvSimple(text){
  text=text.replace(/^\ufeff/,"");
  const rows=[];let i=0,field="",row=[],q=false;
  const pf=()=>{row.push(field);field="";};const pr=()=>{rows.push(row);row=[];};
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else{if(c==='"')q=true;else if(c===",")pf();else if(c==="\r"){}else if(c==="\n"){pf();pr();}else field+=c;}
    i++;}
  if(field.length||row.length){pf();pr();}
  if(!rows.length)return {headers:[],records:[]};
  const headers=rows[0].map(h=>String(h).trim());
  const records=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>{
    const o={};headers.forEach((h,idx)=>o[h]=r[idx]!==undefined?String(r[idx]).trim():"");return o;});
  return {headers,records};
}

function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    // 업로드 제한: 이미지 형식 + 5MB 이하 (보안/데이터 품질)
    if(file.size>5*1024*1024){rej(new Error("사진은 5MB 이하만 업로드할 수 있습니다."));return;}
    if(!/^image\//.test(file.type||"")){rej(new Error("이미지 파일만 업로드할 수 있습니다."));return;}
    const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);
  });
}

function csvCell(value){let v=String(value==null?"":value);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCsv(rows,filename){const csv=rows.map(r=>r.map(csvCell).join(",")).join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

        <li>스크립트가 서버 캐시를 지우므로, 서버를 다시 시작하면 지도에 바로 반영됩니다. (그대로 두면 최대 6시간 뒤 반영)</li>
